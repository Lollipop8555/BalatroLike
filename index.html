<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12181f" />
<title>BalatroLike · 网页版小丑牌</title>
<meta name="description" content="开源学术学习项目：纯前端实现的小丑牌风格 roguelike deckbuilder" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23d94a4a'/%3E%3Ctext x='50' y='70' font-size='58' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E" />
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-4.7-8-10a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.3-8 10-8 10z"/></symbol>
  <symbol id="i-diamond" viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z"/></symbol>
  <symbol id="i-spade" viewBox="0 0 24 24"><path d="M12 2c4 4 8 6.6 8 10a4.2 4.2 0 0 1-7 3.1c.2 2.2 1 3.9 2.4 4.9H8.6c1.4-1 2.2-2.7 2.4-4.9A4.2 4.2 0 0 1 4 12c0-3.4 4-6 8-10z"/></symbol>
  <symbol id="i-club" viewBox="0 0 24 24"><path d="M12 2.5a3.7 3.7 0 0 1 3.2 5.6A3.7 3.7 0 1 1 17 15a3.7 3.7 0 0 1-2.6-1.1c.2 2.2 1 3.9 2.4 4.9H7.2c1.4-1 2.2-2.7 2.4-4.9A3.7 3.7 0 1 1 8.8 8.1 3.7 3.7 0 0 1 12 2.5z"/></symbol>
</svg>

<div class="app" id="app">
  <header class="hud" id="hud" aria-label="对局状态"></header>
  <main class="board">
    <div class="jokers" id="jokers" aria-label="小丑牌区"></div>
    <div class="stage" id="stage"></div>
  </main>
  <section class="hand-area" aria-label="手牌区">
    <div class="area-label" id="handLabel"></div>
    <div class="hand" id="hand"></div>
  </section>
  <footer class="actions" id="actions"></footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="入口"></div>
  <div class="sheet sheet-sub" id="sheetSub" role="dialog" aria-modal="true" aria-label="详情" hidden></div>
</div>
<div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
